<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>l o s t  a r c h i v e _ 001</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- START PAGE -->

    <main
        class="start-page"
        id="start-page"
    >

        <button
            class="archive-title"
            id="enter-archive"
        >
            l o s t  a r c h i v e _ 001
        </button>

    </main>


    <!-- ARCHIVE PAGE -->

    <main
        class="archive"
        id="archive-page"
    >

        <h1>
            l o s t  a r c h i v e _ 001
        </h1>


        <section class="player">


            <!-- TRACK INFORMATION -->

            <div class="track-info">

                <span
                    class="track-number"
                    id="track-number"
                >
                    001
                </span>


                <span
                    class="track-name"
                    id="track-name"
                >
                    surd
                </span>

            </div>


            <!-- AUDIO -->

            <audio id="audio"></audio>


            <!-- PLAY -->

            <button
                class="play-button"
                id="play-button"
            >
                play
            </button>


            <!-- PROGRESS -->

            <div
                class="progress-container"
                id="progress-container"
            >

                <div class="progress-bar"></div>

                <div class="progress-handle"></div>

            </div>


            <!-- TIME -->

            <div class="time">

                <span id="current-time">
                    00:00
                </span>


                <span id="duration">
                    00:00
                </span>

            </div>


            <!-- PREVIOUS / NEXT -->

            <div class="track-navigation">

                <button
                    class="navigation-button"
                    id="previous-button"
                    aria-label="Previous track"
                >
                    ←
                </button>


                <button
                    class="navigation-button"
                    id="next-button"
                    aria-label="Next track"
                >
                    →
                </button>

            </div>


        </section>


        <!-- ABOUT -->

        <button class="about-button">
            about
        </button>


    </main>


    <script src="script.js"></script>

</body>

</html>
